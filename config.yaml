赛事:
  名称: 2026大乱斗
  比赛日期: 2026-07-19

人员:
  女队员数量: 16        # 编号 1-16
  男队员数量: 48        # 编号 17-64(17-24 为队长)
  队伍数量: 8
  每队女生数: 2
  每队男生数: 6          # 含队长
  队长性别: 男

赛制:
  总轮数: 3
  每轮场次: 5            # 女双1 + 男双3 + 盲抽1
  获胜所需场次: 3        # 5场3胜
  每局分数: 21
  缺人队伍分数: 15       # 比赛日缺人的队伍,其所有对局改用的分制
  每场局数: 3            # 三局两胜
  盲抽局类型: [混双, 混双, 男双]   # 按轮次

场地:
  场地总数: 10
  每组场地数: 5          # 每 4 队一组,共 2 组并行

时长模型:                 # 单位: 分钟,均为 21 分制单局(1 game)预估
  女双单局时长: 10
  男双单局时长: 13
  混双单局时长: 13
  强强对话加时: 3         # 第一轮一律不加时
  每局净胜阈值: 6         # 上一场平均每局净胜 ≥ 6 的组合视为"强"
  每场净胜阈值: 12        # 或上一场全场累计净胜 ≥ 12 亦视为"强"
  连续出场休息: 5         # 同一人连打两场之间的最短休息时间
  换场间隔: 2
  分制缩放: true          # 15分制时长 = 21分制时长 × 15/21,四舍五入

可视化:
  场地颜色:
    空闲: "#4CAF50"      # 绿色
    热身: "#FFC107"      # 黄色
    第一局: "#FF8A80"    # 浅红色
    第二局: "#D32F2F"    # 深红色
    第三局: "#AD1457"    # 紫红色

广播:
  刷新间隔秒: 5           # 观众页自动刷新频率
  志愿者:                 # 每人独立姓名/PIN/负责场地
